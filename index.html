<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBR Jar</title>
</head>
<body>
  <h1>TBR Jar</h1>
  <p>Less deciding, more reading.</p>

  <h2>Add a book</h2>
  <input id="bookInput" type="text" placeholder="e.g. Solaris">
  <button id="addBtn">Add</button>

  <h2>In the jar</h2>
  <ol id="slips"></ol>

  <button id="shakeBtn">Shake the jar</button>
  <p id="result"></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TBR Jar</title>
</head>

<body>
  <header>
    <h1>TBR Jar</h1>
    <p>Less deciding, more reading.</p>
  </header>

  <main>
    <section id="add">
      <h2><label for="slip-input">Add a book</label></h2>
      <form id="add-form">
        <input id="slip-input" type="text" placeholder="e.g., Solaris" maxlength="80" required>
        <button>Add</button>
      </form>
    </section>

    <section id="jar">
      <h2>In the jar</h2>
      <ol id="slip-list"></ol>
    </section>
  </main>

  <script>
    const slips = [];

    const form = document.querySelector("#add-form");
    const input = document.querySelector("#slip-input");
    const list = document.querySelector("#slip-list");

    function render() {
      list.innerHTML = "";

      for (let i = 0; i < slips.length; i++) {
        const li = document.createElement("li");
        li.textContent = slips[i].title;
        list.appendChild(li);
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const title = input.value.trim();
      if (title === "") {
        return;
      }

      slips.push({ id: Date.now(), title: title });
      render();
      input.value = "";
    });
  </script>
</body>

</html>
